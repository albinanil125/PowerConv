<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerConv - Ultimate File & PDF Studio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .tool-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }
        .tab-btn {
            background: rgba(13, 0, 26, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #a78bfa;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.3s ease;
        }
        .tab-btn.active, .tab-btn:hover {
            background: linear-gradient(135deg, #a855f7, #ec4899);
            color: white;
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <div class="header">
            <h1>Power<span class="bio-comp">Conv</span></h1>
        </div>
        <h2>All-In-One Document & Media Studio</h2>
        
        <div class="tool-tabs">
            <button class="tab-btn active" onclick="setTool('convert', this)">⚡ File Converter</button>
            <button class="tab-btn" onclick="setTool('pdf_edit', this)">📄 PDF Rearrange / Rotate</button>
            <button class="tab-btn" onclick="setTool('image_enhance', this)">🖼️ Image Enhancer & Resizer</button>
        </div>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="tool_type" id="toolTypeInput" value="convert">

            <div class="upload-area" onclick="document.getElementById('fileInput').click();">
                <p id="uploadPrompt">Click or select a file to convert</p>
                <input type="file" id="fileInput" name="file" required style="display:none;" onchange="showFileName(this)">
                <div id="fileNameDisplay" style="color: #fff; margin-top: 10px; font-weight: 600;"></div>
            </div>
            
            <button type="submit" class="btn-process" style="padding: 14px; font-weight: 600; border-radius: 8px; width: 100%;">Upload & Open Tool Studio</button>
        </form>
    </div>

    <script>
        function setTool(toolName, btnElement) {
            document.getElementById('toolTypeInput').value = toolName;
            
            // Update active button state
            let buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            // Update prompt text
            let prompt = document.getElementById('uploadPrompt');
            if (toolName === 'convert') {
                prompt.innerText = "Select an Image, Spreadsheet, or Text file to convert";
            } else if (toolName === 'pdf_edit') {
                prompt.innerText = "Select a PDF file to rearrange pages or rotate";
            } else if (toolName === 'image_enhance') {
                prompt.innerText = "Select an Image to resize or enhance brightness/sharpness";
            }
        }

        function showFileName(input) {
            if (input.files && input.files[0]) {
                document.getElementById('fileNameDisplay').innerText = "Selected File: " + input.files[0].name;
            }
        }
    </script>
</body>
</html>
