<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PowerConv - Universal File Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0d0614 url('/static/bg.jpg') center/cover no-repeat fixed;
            background-blend-mode: overlay;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Ambient Glow Effect */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
            top: 10%;
            left: 20%;
            z-index: -1;
            filter: blur(60px);
        }

        body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
            bottom: 10%;
            right: 20%;
            z-index: -1;
            filter: blur(80px);
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: rgba(22, 11, 38, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .logo span {
            background: linear-gradient(135deg, #c084fc, #e879f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            color: #a78bfa;
            font-size: 14px;
            font-weight: 400;
            margin-bottom: 35px;
            opacity: 0.9;
        }

        .upload-box {
            border: 2px dashed rgba(192, 132, 252, 0.35);
            border-radius: 16px;
            padding: 35px 20px;
            background: rgba(13, 6, 20, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .upload-box:hover {
            border-color: #c084fc;
            background: rgba(192, 132, 252, 0.08);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.2);
        }

        .upload-icon {
            font-size: 42px;
            margin-bottom: 12px;
            display: block;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            background: rgba(255, 255, 255, 0.08);
            color: #e9d5ff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: 0.2s ease;
        }

        .file-label:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .selected-filename {
            margin-top: 12px;
            font-size: 13px;
            color: #f0abfc;
            word-break: break-all;
        }

        .btn {
            width: 100%;
            background: linear-gradient(135deg, #9333ea, #c084fc);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(147, 51, 234, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(147, 51, 234, 0.6);
            background: linear-gradient(135deg, #a855f7, #e879f9);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Power<span>Conv</span></div>
        <div class="tagline">Next-generation universal file conversion platform</div>

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <div class="upload-box" onclick="document.getElementById('fileInput').click();">
                <span class="upload-icon">⚡</span>
                <p style="font-size: 15px; margin-bottom: 10px; color: #f3e8ff;">Click or Drag & Drop your file here</p>
                <label class="file-label" onclick="event.stopPropagation();">Browse File</label>
                <input type="file" id="fileInput" name="file" required onchange="showFileName(this)">
                <div class="selected-filename" id="fileNameDisplay"></div>
            </div>
            <button type="submit" class="btn">Upload & Process</button>
        </form>
    </div>

    <script>
        function showFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                display.innerText = "Selected: " + input.files[0].name;
            }
        }
    </script>
</body>
</html>
